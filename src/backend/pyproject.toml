[project]
name = "internal-business-strategic-platform-backend"
version = "0.1.0"
description = "Internal Business Strategic Platform Backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "pwdlib[argon2]==0.2.1",
    "PyJWT==2.10.1",
    "email-validator==2.2.0",
    "redis>=5.2.0,<6.0.0",
    "Authlib>=1.3.2,<2.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"